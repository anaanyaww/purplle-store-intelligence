services:
  api:
    build: .
    container_name: store-intelligence-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./static:/app/static
    environment:
      - DB_PATH=/app/data/store_intelligence.db
      - POS_CSV_PATH=/app/data/pos_transactions.csv
      - STORE_LAYOUT_PATH=/app/data/store_layout.json
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
